[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/detector",
    "crates/analytics",
    "crates/replay",
    "crates/mdclient",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
setups-domain = { path = "crates/domain" }
setups-detector = { path = "crates/detector" }

[profile.release]
lto = "thin"
