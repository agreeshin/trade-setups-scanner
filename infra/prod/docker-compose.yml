name: trade-setups

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trade_setups
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: market_data
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trade_setups -d market_data"]
      interval: 5s
      timeout: 3s
      retries: 12

  market-data:
    build:
      context: ../..
      dockerfile: Dockerfile.service
      args:
        SERVICE: market-data
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://trade_setups:${POSTGRES_PASSWORD}@postgres:5432/market_data
      TEST_DATABASE_URL: postgres://trade_setups:${POSTGRES_PASSWORD}@postgres:5432/market_data
      API_KEYS: ${MARKET_DATA_API_KEY:?set MARKET_DATA_API_KEY in .env}
      PORT: 8080
      HOST: 0.0.0.0
      LOG_LEVEL: info
      BYBIT_INGEST_ENABLED: ${BYBIT_INGEST_ENABLED:-1}
      BYBIT_REST_MAX_RPS: ${BYBIT_REST_MAX_RPS:-30}
      BYBIT_REQUEST_TIMEOUT_MS: ${BYBIT_REQUEST_TIMEOUT_MS:-5000}
      BYBIT_FRESH_TICK_MS: ${BYBIT_FRESH_TICK_MS:-2000}
      BYBIT_FRESH_FALLBACK_DELAY_MS: ${BYBIT_FRESH_FALLBACK_DELAY_MS:-3000}
      BYBIT_FRESH_REPAIR_MINUTES: ${BYBIT_FRESH_REPAIR_MINUTES:-5}
      BYBIT_FRESH_MAX_SYMBOLS: ${BYBIT_FRESH_MAX_SYMBOLS:-4096}
      BYBIT_FRESH_CONCURRENCY: ${BYBIT_FRESH_CONCURRENCY:-8}
      BYBIT_WS_SHARD_SYMBOLS: ${BYBIT_WS_SHARD_SYMBOLS:-200}
      BYBIT_WS_MAX_PAYLOAD_BYTES: ${BYBIT_WS_MAX_PAYLOAD_BYTES:-262144}
      BACKFILL_MAX_PENDING_JOBS: ${BACKFILL_MAX_PENDING_JOBS:-100}
      BACKFILL_MAX_WORK_MINUTES: ${BACKFILL_MAX_WORK_MINUTES:-2635200}
      MARKET_DATA_MAX_DATABASE_BYTES: ${MARKET_DATA_MAX_DATABASE_BYTES:-107374182400}
      BACKFILL_ESTIMATED_BYTES_PER_MINUTE: ${BACKFILL_ESTIMATED_BYTES_PER_MINUTE:-512}
      BACKUP_SCOPE: market-data
      BACKUP_DIR: /var/lib/trade-setups/backups
      BACKUP_MAX_UPLOAD_BYTES: ${MARKET_DATA_BACKUP_MAX_UPLOAD_BYTES:-128849018880}
      BACKUP_ROLLBACK_RETENTION: ${BACKUP_ROLLBACK_RETENTION:-3}
    volumes:
      - ./backups/market-data:/var/lib/trade-setups/backups
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080"

  signals-rust:
    build:
      context: ../..
      dockerfile: services/setups-platform-rs/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://trade_setups:${POSTGRES_PASSWORD}@postgres:5432/signals
      API_KEYS: ${PLATFORM_API_KEY:?set PLATFORM_API_KEY in .env}
      MARKET_DATA_URL: http://market-data:8080
      MARKET_DATA_API_KEY: ${MARKET_DATA_API_KEY}
      PORT: 8082
      HOST: 0.0.0.0
      LOG_LEVEL: info
      REPLAY_WORKERS: "2"
      # Application pool budgets include the optimizer's detached owner connection.
      RUNTIME_MAX_DB_CONNECTIONS: ${RUNTIME_MAX_DB_CONNECTIONS:-20}
      API_DB_CONNECTIONS: ${API_DB_CONNECTIONS:-6}
      LIVE_DB_CONNECTIONS: ${LIVE_DB_CONNECTIONS:-4}
      FIXED_LIVE_MAX_HISTORY_BYTES: ${FIXED_LIVE_MAX_HISTORY_BYTES:-4294967296}
      MANUAL_DB_CONNECTIONS: ${MANUAL_DB_CONNECTIONS:-4}
      CONTINUOUS_DB_CONNECTIONS: ${CONTINUOUS_DB_CONNECTIONS:-4}
      CONTINUOUS_MAX_CONCURRENT_CHAINS: ${CONTINUOUS_MAX_CONCURRENT_CHAINS:-1}
      # Unset stays unset: Rust derives the CPU default from available_parallelism.
      CONTINUOUS_TOTAL_CPU_THREADS:
      CONTINUOUS_TOTAL_MEMORY_BYTES: ${CONTINUOUS_TOTAL_MEMORY_BYTES:-17179869184}
      LIVE_NOTIFICATION_MAX_PENDING: ${LIVE_NOTIFICATION_MAX_PENDING:-10000}
      LIVE_NOTIFICATION_MAX_PENDING_BYTES: ${LIVE_NOTIFICATION_MAX_PENDING_BYTES:-67108864}
      REPLAY_MAX_PENDING_RUNS: ${REPLAY_MAX_PENDING_RUNS:-10000}
      REPLAY_MAX_WORK_MINUTES: ${REPLAY_MAX_WORK_MINUTES:-5270400000}
      REPLAY_MAX_DATABASE_BYTES: ${REPLAY_MAX_DATABASE_BYTES:-53687091200}
      REPLAY_ESTIMATED_BYTES_PER_MINUTE: ${REPLAY_ESTIMATED_BYTES_PER_MINUTE:-128}
      OPTIMIZATION_CPU_THREADS: ${OPTIMIZATION_CPU_THREADS:-2}
      OPTIMIZATION_BATCH_SIZE: ${OPTIMIZATION_BATCH_SIZE:-4}
      OPTIMIZATION_MAX_SNAPSHOT_BYTES: ${OPTIMIZATION_MAX_SNAPSHOT_BYTES:-8589934592}
      OPTIMIZATION_MAX_WORKING_BYTES: ${OPTIMIZATION_MAX_WORKING_BYTES:-268435456}
      OPTIMIZATION_MAX_SETUPS_PER_CANDIDATE: ${OPTIMIZATION_MAX_SETUPS_PER_CANDIDATE:-100000}
      OPTIMIZATION_MAX_INSTRUMENTS: ${OPTIMIZATION_MAX_INSTRUMENTS:-1000}
      OPTIMIZATION_MAX_REQUEST_BYTES: ${OPTIMIZATION_MAX_REQUEST_BYTES:-262144}
      OPTIMIZATION_MAX_DOMAIN_VALUES: ${OPTIMIZATION_MAX_DOMAIN_VALUES:-4096}
      CONTINUOUS_WORKERS: "1"
      CONTINUOUS_MAX_SNAPSHOT_BYTES: ${CONTINUOUS_MAX_SNAPSHOT_BYTES:-8589934592}
      CONTINUOUS_MAX_WORKING_BYTES: ${CONTINUOUS_MAX_WORKING_BYTES:-67108864}
      BACKUP_ROLLBACK_RETENTION: ${BACKUP_ROLLBACK_RETENTION:-3}
      BACKUP_DIR: /var/lib/trade-setups/backups
      BACKUP_MAX_UPLOAD_BYTES: ${PLATFORM_BACKUP_MAX_UPLOAD_BYTES:-64424509440}
    volumes:
      - ./backups/platform-rust:/var/lib/trade-setups/backups
    depends_on:
      postgres:
        condition: service_healthy
      market-data:
        condition: service_started
    ports:
      - "127.0.0.1:8083:8082"

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - signals-rust
    ports:
      - "80:80"
